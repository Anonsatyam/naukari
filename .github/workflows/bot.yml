name: Run recruitment bot

on:
  schedule:
    # Every 4 hours. GitHub's cron scheduling isn't guaranteed to the
    # minute — fine for this, not fine if you ever need second-precision.
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        # Only Chromium is used (see fetchWithPlaywright.ts), and
        # --with-deps pulls in the OS-level libraries the browser needs
        # that a bare Ubuntu runner doesn't have by default.
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_SITE_URL: ${{ secrets.BOT_SITE_URL }}
        run: npm run bot