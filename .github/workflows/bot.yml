name: Run recruitment bot

on:
  schedule:
    # Every 4 hours, at :17 rather than :00 — GitHub's own docs warn
    # that scheduled workflows queue up (and get delayed or dropped
    # outright under high load) most at the top of every hour, since
    # every other repo's cron piles onto that same minute too.
    # Confirmed happening here: pulling actual run history showed only
    # 8 of the ~16 runs expected over a ~65 hour window actually fired,
    # with gaps growing past 13 hours between some of them. Moving off
    # :00 is GitHub's documented mitigation for exactly this.
    - cron: "17 */4 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        # Only Chromium is used (see fetchWithPlaywright.ts), and
        # --with-deps pulls in the OS-level libraries the browser needs
        # that a bare Ubuntu runner doesn't have by default.
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_SITE_URL: ${{ secrets.BOT_SITE_URL }}
        run: npm run bot